[package]
name        = "clauders"
description = "Unofficial Rust SDK for the Anthropic Claude Messages API."
version     = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true
readme      = "README.md"
keywords    = ["claude", "anthropic", "llm", "sdk", "ai"]
categories  = ["api-bindings", "web-programming::http-client", "asynchronous"]

[lints]
workspace = true

[dependencies]
airs-transport = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
secrecy        = { workspace = true }
tracing        = { workspace = true }
url            = { workspace = true }
http           = { workspace = true }
bytes          = { workspace = true }
futures-core       = { workspace = true }
pin-project-lite   = { workspace = true }
async-trait        = { workspace = true }
tokio          = { workspace = true, features = ["process"] }
eventsource-stream   = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", default-features = false, features = ["signal", "process"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29.0", default-features = false, features = ["signal", "process"] }

[dev-dependencies]
tokio        = { workspace = true, features = ["full", "test-util"] }
mockall      = { workspace = true }
wiremock     = { workspace = true }
futures-util = { workspace = true }
trybuild     = { workspace = true }
insta        = { workspace = true }
tempfile     = { workspace = true }
base64       = { workspace = true }
ratatui      = { workspace = true }

[[bin]]
name              = "clauders-agent-testchild"
path              = "src/bin/clauders-agent-testchild.rs"

[[example]]
name             = "01_hello"
path             = "examples/messages/01_hello/main.rs"

[[example]]
name             = "02_streaming"
path             = "examples/messages/02_streaming/main.rs"

[[example]]
name             = "03_tools"
path             = "examples/messages/03_tools/main.rs"

[[example]]
name             = "04_caching"
path             = "examples/messages/04_caching/main.rs"

[[example]]
name             = "05_structured_output"
path             = "examples/messages/05_structured_output/main.rs"

[[example]]
name             = "06_thinking"
path             = "examples/messages/06_thinking/main.rs"

[[example]]
name             = "07_agentic_tool_loop"
path             = "examples/messages/07_agentic_tool_loop/main.rs"

[[example]]
name             = "08_vision"
path             = "examples/messages/08_vision/main.rs"

[[example]]
name             = "09_document_citations"
path             = "examples/messages/09_document_citations/main.rs"

[[example]]
name             = "10_batches"
path             = "examples/messages/10_batches/main.rs"

[[example]]
name             = "11_coding_agent"
path             = "examples/messages/11_coding_agent/main.rs"
