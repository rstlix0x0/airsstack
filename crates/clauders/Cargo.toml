[package]
name        = "clauders"
description = "Unofficial Rust SDK for the Anthropic Claude Messages API."
version     = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true
readme      = "README.md"
keywords    = ["claude", "anthropic", "llm", "sdk", "ai"]
categories  = ["api-bindings", "web-programming::http-client", "asynchronous"]

[lints]
workspace = true

[dependencies]
airs-transport = { path = "../airs-transport" }
openrouter-rs  = { path = "../openrouter-rs" }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
secrecy        = { workspace = true }
tracing        = { workspace = true }
url            = { workspace = true }
http           = { workspace = true }
http-body      = { workspace = true }
http-body-util = { workspace = true }
bytes          = { workspace = true }
futures-core       = { workspace = true }
pin-project-lite   = { workspace = true }
async-trait        = { workspace = true }
tokio          = { workspace = true, features = ["process"] }
eventsource-stream   = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", default-features = false, features = ["signal", "process"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29.0", default-features = false, features = ["signal", "process"] }

[dev-dependencies]
tokio        = { workspace = true, features = ["full", "test-util"] }
mockall      = { workspace = true }
wiremock     = { workspace = true }
futures-util = { workspace = true }
trybuild     = { workspace = true }
insta        = { workspace = true }

[[bin]]
name              = "clauders-agent-testchild"
path              = "src/bin/clauders-agent-testchild.rs"

[[example]]
name             = "01_hello"

[[example]]
name             = "02_streaming"

[[example]]
name             = "03_tools"

[[example]]
name             = "04_caching"
