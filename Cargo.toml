[workspace]
resolver = "3"
members  = ["crates/airs-transport", "crates/airsl", "crates/airsl-cli", "crates/clauders", "crates/openrouter-rs"]

[workspace.package]
edition       = "2024"
rust-version  = "1.94"
license       = "Apache-2.0"
repository    = "https://github.com/rstlix0x0/airsstack"
authors       = ["rstlix0x0 <rstlix.dev@gmail.com>"]
publish       = false

[workspace.dependencies]
# Async runtime — core (tokio-only stance per spec §3)
tokio              = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "io-util"] }
tokio-util         = { version = "0.7.19", default-features = false }
# HTTP types + bodies + streams
http               = "1.4.1"
http-body          = "1.0.1"
http-body-util     = "0.1.3"
bytes              = "1.11.1"
futures-core       = "0.3.32"
futures-util       = { version = "0.3.32", default-features = false, features = ["std"] }
pin-project-lite   = "0.2.17"
# Default transport (feature-gated in member crate)
reqwest            = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2"] }
# SSE parsing
eventsource-stream = "0.2.3"
# Serialization
serde              = { version = "1.0.228", features = ["derive"] }
serde_json         = "1.0.150"
# Errors + tracing + traits
thiserror          = "2.0.18"
tracing            = "0.1.44"
async-trait        = "0.1.89"
# URL handling + secret protection
url                = "2.5.8"
secrecy            = "0.10.3"
# Embedded Lua runtime. `vendored` compiles Lua 5.4 from the C sources shipped by
# `lua-src`, so no system Lua and no pkg-config are involved — but a C compiler is
# required to build the workspace. `serialize` bridges Lua values through serde.
# Lua 5.4 (not 5.1/LuaJIT) because only 5.3+ distinguishes integers from floats,
# which the JSON the plugin hooks exchange depends on.
mlua               = { version = "0.12", features = ["lua54", "vendored", "serialize", "send"] }
# CLI argument parsing (airsl-cli)
clap               = { version = "4", features = ["derive"] }
# Host-module support for the Lua standard library
regex              = "1"
globset            = "0.4"
walkdir            = "2.5"
sha2               = "0.10"
# SHA-1 for compatibility only. The plugin suite derives its per-repository
# project key with `hashlib.sha1(...)[:8]` and `shasum | cut -c1-8`; shipping
# only SHA-256 would silently re-key every project and orphan its artifacts.
sha1               = "0.10"
# Time formatting. `jiff` over `time` because it reads /etc/localtime directly
# instead of libc `tzset`, so local time resolves in multi-threaded embedders.
jiff               = "0.2"
# Temp files and dirs. Dev-only for the SDK crates; a runtime dependency of
# `airsl`, which exposes `airsstack.fs.tempdir` to Lua.
tempfile           = "3.23.0"
# Dev-only (member crates reference these in [dev-dependencies])
mockall            = "0.14.0"
wiremock           = "0.6.5"
insta              = "1.47.2"
trybuild           = "1"
base64             = "0.22.1"
ratatui            = "0.29.0"
# Internal workspace members — path for local builds, version for publish-readiness.
# Members inherit these with `{ workspace = true }`. Paths are relative to the workspace root.
# (clauders has no entry: nothing else depends on it.)
airs-transport     = { version = "0.1.0", path = "crates/airs-transport" }
airsl              = { version = "0.1.0", path = "crates/airsl" }
openrouter-rs      = { version = "0.1.0", path = "crates/openrouter-rs" }

[workspace.lints.rust]
unsafe_code        = "forbid"
missing_docs       = "warn"
unreachable_pub    = "warn"
unused_must_use    = "deny"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
nursery            = { level = "warn", priority = -1 }
unwrap_used        = "deny"
expect_used        = "warn"
panic              = "deny"
todo               = "warn"
dbg_macro          = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.release]
lto                = "thin"
codegen-units      = 1
strip              = "symbols"
